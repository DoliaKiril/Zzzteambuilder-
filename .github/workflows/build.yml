name: Build ZZZ Synergy Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Accept Android SDK Licenses & Build APK via Capacitor
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

          rm -rf www android package.json package-lock.json capacitor.config.json capacitor.config.ts
          mkdir -p www

          if [ -f "index.html" ]; then
            cp index.html www/
          else
            FOUND_HTML=$(find . -maxdepth 3 -name "index.html" -not -path "./www/*" | head -n 1)
            if [ -n "$FOUND_HTML" ]; then cp "$FOUND_HTML" www/index.html; fi
          fi

          for f in db_mechanics.js db_equipment.js db_agents.js db_bosses.js; do
            if [ -f "$f" ]; then
              cp "$f" www/
            else
              FOUND_DB=$(find . -maxdepth 3 -name "$f" -not -path "./www/*" | head -n 1)
              if [ -n "$FOUND_DB" ]; then cp "$FOUND_DB" "www/$f"; fi
            fi
          done

          cat << 'PKG_EOF' > package.json
          {
            "name": "zzz-synergy-helper",
            "version": "3.3.0",
            "private": true
          }
          PKG_EOF

          cat << 'CAP_EOF' > capacitor.config.json
          {
            "appId": "com.proxy.zzzsynergy",
            "appName": "ZZZ Phaethon OS",
            "webDir": "www"
          }
          CAP_EOF

          npm install @capacitor/core@^7.0.0 @capacitor/cli@^7.0.0 @capacitor/android@^7.0.0
          npx cap add android
          npx cap copy android
          sed -i 's/android:configChanges="/android:screenOrientation="sensorLandscape" android:configChanges="/g' android/app/src/main/AndroidManifest.xml
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Ready-to-Install APK
        uses: actions/upload-artifact@v4
        with:
          name: ZZZ-Synergy-Helper-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
